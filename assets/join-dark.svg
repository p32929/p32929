<svg xmlns="http://www.w3.org/2000/svg" width="880" height="132" viewBox="0 0 880 132"><rect x="0.5" y="0.5" width="879" height="131" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(0,-32)"><text x="28" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start">Put your own apps on OpenStore</text><text x="28" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">free, your listing lives in your own repo. just 4 simple steps:</text><text x="28" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="700" fill="#58a6ff" text-anchor="start">[1]</text><text x="66" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#e6edf3" text-anchor="start">copy the template</text><text x="308" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="700" fill="#58a6ff" text-anchor="start">[2]</text><text x="346" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#e6edf3" text-anchor="start">add one .md per app</text><text x="28" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="700" fill="#58a6ff" text-anchor="start">[3]</text><text x="66" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#e6edf3" text-anchor="start">run node validate.mjs</text><text x="308" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="700" fill="#58a6ff" text-anchor="start">[4]</text><text x="346" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="400" fill="#e6edf3" text-anchor="start">open one pull request</text><rect x="642" y="74" width="210" height="48" rx="10" fill="#58a6ff"/><text x="664" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#161b22" text-anchor="start">read the guide</text><path d="M808 98h18m-7-7 7 7-7 7" fill="none" stroke="#161b22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>